version: 2

models:
  - name: stg_sellers
    description: "Cleaned seller records from raw Olist sellers table. Zip code prefix intentionally dropped — no current analytical use."
    columns:
      - name: seller_id
        description: "Unique identifier for a seller (marketplace account)."
        tests:
          - unique
          - not_null
      - name: seller_city
        description: "City where the seller is registered."
      - name: seller_state
        description: "State where the seller is registered."

  - name: stg_orders
    description: "Cleaned order records from raw Olist orders table. Customer_ID, Order Approved At, Order Delivered Carrier Date, and Order Estimated Date removed since no current analytical use."
    columns:
      - name: order_id
        description: "Unique identifier for orders (marketplace account)."
        tests:
          - unique
          - not_null
      - name: order_purchase_timestamp
        description: "Time when the order created by the customer."
      - name: order_status
        description: "Tells whether the order: delivered, invoiced, shipped, processing, unavailable, canceled, created, or approved"
        tests:
          - accepted_values:
              values: ['delivered', 'invoiced', 'shipped', 'processing', 'unavailable', 'canceled', 'created', 'approved']

  - name: stg_products
    description: "Cleaned product records from raw Olist products table. Only product_id and product_category_name kept — physical/listing attribute columns (name/description length, photo count, weight, dimensions) dropped since they don't answer the seller-risk business question."
    columns:
      - name: product_id
        description: "Unique identifier for a product."
        tests:
          - unique
          - not_null
      - name: category_name
        description: "Product category (original, untranslated form). Renamed from product_category_name to align join key with stg_category_translation. NULL for ~610 products — left as-is, no imputation. This is the only source for category; order_items cannot backfill it (category is NULL on every real order row there)."

  - name: stg_category_translation
    description: "Category name translation reference (Portuguese to English), loaded via dbt seed from the real Olist product_category_name_translation.csv (not in the raw schema — dbt-managed seed, referenced via ref() not source())."
    columns:
      - name: category_name
        description: "Product category, original (Portuguese) form. Renamed from product_category_name to align join key with stg_products."
        tests:
          - unique
          - not_null
      - name: category_name_english
        description: "English translation of the product category. Renamed from product_category_name_english."
        tests:
          - not_null

  - name: stg_order_items
    description: "Cleaned order-item records from raw Olist order_items table. Grain is (order_id, order_item_id) — see tests/assert_stg_order_items_unique_grain.sql for the composite-key uniqueness check. Filters out ~32,951 phantom rows (WHERE order_id IS NOT NULL) that are a join/union artifact upstream, not real data. Dropped shipping_limit_date and all 8 product-attribute columns (all NULL on every real row here; category comes from stg_products/stg_category_translation instead). This is the join point connecting orders to sellers, and the source of price/freight_value for GMV."
    columns:
      - name: order_id
        description: "Order this line item belongs to. FK to stg_orders."
        tests:
          - not_null
      - name: order_item_id
        description: "Line item sequence number within the order (1-21 observed)."
        tests:
          - not_null
      - name: product_id
        description: "Product sold in this line item. FK to stg_products."
        tests:
          - not_null
      - name: seller_id
        description: "Seller responsible for this line item. FK to stg_sellers — the orders-to-sellers join point."
        tests:
          - not_null
      - name: price
        description: "Item price. Component of GMV."
        tests:
          - not_null
      - name: freight_value
        description: "Freight/shipping cost for this line item. Component of GMV."
        tests:
          - not_null

  - name: stg_qualified_leads
    description: "Cleaned marketing-qualified-lead records from raw Olist qualified_leads table. Only mql_id and origin kept — first_contact_date and landing_page_id dropped, no current analytical use. This is the acquisition-channel (origin) source for the funnel-attribution driver; only ~842 of 8,000 leads here go on to close as a seller (see stg_closed_deals)."
    columns:
      - name: mql_id
        description: "Unique identifier for a marketing-qualified lead."
        tests:
          - unique
          - not_null
      - name: origin
        description: "Acquisition channel the lead originated from (e.g. social, paid_search, organic_search, email). NULL on ~60 of 8,000 rows — left as-is, no imputation."

  - name: stg_closed_deals
    description: "Cleaned closed-deal records from raw Olist closed_deals table — the subset of qualified_leads that converted into a seller. Only mql_id and seller_id kept; sdr_id, sr_id, won_date, business_segment, lead_type, and the remaining sales-qualification columns dropped, no current analytical use (business_segment/lead_type specifically reviewed and cut per PROCESS.md's driver-screening criteria). 842 rows, one per seller_id and one per mql_id — but only 380 of those 842 seller_ids actually exist in stg_sellers (real transacting sellers); the other 462 reference sellers with no order/transaction data anywhere else in this project. This is the funnel-attribution join point (mql_id -> stg_qualified_leads for origin)."
    columns:
      - name: mql_id
        description: "Marketing-qualified lead that converted. FK to stg_qualified_leads."
        tests:
          - unique
          - not_null
      - name: seller_id
        description: "Seller this closed deal produced. Not guaranteed to exist in stg_sellers — see model description."
        tests:
          - unique
          - not_null