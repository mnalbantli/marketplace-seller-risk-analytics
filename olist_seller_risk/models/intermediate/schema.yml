version: 2

models:
  - name: int_seller_order_activity
    description: "One row per seller, aggregating stg_orders joined to stg_order_items on order_id. Reference date is MAX(order_purchase_timestamp) across the whole dataset, computed once and reused for recency_days and the two 30-day trend windows. order_status is bucketed into 'delivered', 'cancelled_unavailable' (canceled, unavailable), and 'unresolved_unknown' (invoiced, shipped, processing, created, approved). GMV and order_count are delivered-only. cancellation_rate and unresolved_rate are each bucket's distinct order count over total distinct order count for the seller. orders_last_30d/orders_prior_30d are delivered order counts in the two 30-day windows immediately before the reference date, and are NULL unless trend_eligible (delivered order_count >= 4)."
    columns:
      - name: seller_id
        description: "Unique identifier for a seller (marketplace account). Grain of this model."
        tests:
          - unique
          - not_null
      - name: gmv
        description: "SUM(price) across delivered orders only."
        tests:
          - not_null
      - name: order_count
        description: "COUNT(DISTINCT order_id) across delivered orders only."
        tests:
          - not_null
      - name: cancellation_rate
        description: "Distinct cancelled_unavailable order count / distinct total order count for the seller."
      - name: unresolved_rate
        description: "Distinct unresolved_unknown order count / distinct total order count for the seller."
      - name: recency_days
        description: "Reference date minus the seller's last delivered order's order_purchase_timestamp, in days — same date basis as reference_date (days since the order was placed, not since it arrived). NULL if the seller has no delivered orders."
      - name: trend_eligible
        description: "True if the seller's delivered order_count >= 4."
      - name: orders_last_30d
        description: "Delivered order count in the 30 days immediately before (and including) the reference date. NULL if trend_eligible is false."
      - name: orders_prior_30d
        description: "Delivered order count in the 30 days before orders_last_30d's window. NULL if trend_eligible is false."

  - name: int_seller_category_mix
    description: "One row per (seller_id, category_name), aggregating stg_order_items joined to stg_products on product_id and stg_orders on order_id. Delivered-only (same GMV basis as int_seller_order_activity). Order items with a NULL category_name are excluded entirely — not counted in any seller's numerator or denominator (~1.3% of marketplace GMV, see PROCESS.md). category_gmv is SUM(price) for that seller+category; category_gmv_pct divides it by the seller's own total GMV summed across all their known-category rows (per-seller denominator, not marketplace-wide). Does not collapse to one row per seller or pick a top category — that summarization belongs to the mart layer. Sellers whose only sales are NULL-category are absent from this model entirely (no stub row) — the mart layer must handle that as 'missing', not 'null category'."
    columns:
      - name: seller_id
        description: "Seller this row's category GMV belongs to. Composite grain with category_name."
        tests:
          - not_null
      - name: category_name
        description: "Product category (original, untranslated form, from stg_products). Composite grain with seller_id."
        tests:
          - not_null
      - name: category_gmv
        description: "SUM(price) for this seller's delivered order items in this category."
        tests:
          - not_null
      - name: category_gmv_pct
        description: "category_gmv divided by this seller's total GMV summed across all their known-category rows in this model (per-seller denominator)."
        tests:
          - not_null

  - name: int_seller_acquisition
    description: "SECONDARY / CAVETED DRIVER, not a headline driver — see PROCESS.md's driver-screening table. One row per seller_id, only for sellers present in stg_closed_deals (842 rows — the marketing-funnel-attributed subset), joined to stg_qualified_leads on mql_id to bring in origin (acquisition channel). business_segment and lead_type deliberately excluded — reviewed against PROCESS.md's screening criteria and cut (same coverage ceiling as origin, weaker actionability, likely redundant with category concentration). No stub rows: a seller with no closed-deal record simply doesn't appear here, same pattern as int_seller_category_mix. Coverage caveat: of these 842 sellers, only 380 actually exist in stg_sellers (real transacting sellers) — the other 462 reference sellers with no order/transaction data anywhere else in this project and will never match anything downstream. All 842 rows are kept here regardless (no inner join to stg_sellers at this layer) — the mismatch is left to surface naturally wherever this model gets joined to the transacting-seller universe. origin is NULL on a handful of matched rows (4 of the 380 real-seller rows) and is kept as NULL, not excluded or imputed."
    columns:
      - name: seller_id
        description: "Seller with a closed marketing-funnel deal. Grain of this model. Not guaranteed to exist in stg_sellers — see model description."
        tests:
          - unique
          - not_null
      - name: origin
        description: "Acquisition channel (e.g. social, paid_search, organic_search, email) this seller's closed deal originated from. NULL on a small number of rows — kept as-is, no imputation."
