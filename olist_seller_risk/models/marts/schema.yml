version: 2

models:
  - name: mart_seller_health
    description: "Feature table for the churn-risk model (CLAUDE.md Definition-of-Done item 3/4) — does NOT yet include a churn risk score or GMV-at-risk; those are model outputs joined in later. One row per seller_id, matching int_seller_order_activity's population exactly (3,095 sellers, confirmed identical to stg_sellers — no zero-order population exists, so no sellers are added or dropped by any join below). Base is int_seller_order_activity. Left-joined to int_seller_category_mix, collapsed to one row per seller: top_category is the category with the highest category_gmv for that seller, ties broken alphabetically by category_name (deterministic/stable across runs only — carries no business meaning; as of 2026-08-25, 3 sellers have an exact category_gmv tie). category_concentration_pct is carried through as-is from that top row's category_gmv_pct (already the top category's GMV over the seller's total known-category GMV — not recomputed here). Sellers absent from int_seller_category_mix entirely (all-NULL-category sales, ~1.3% of marketplace GMV excluded per PROCESS.md) get NULL for both fields, no stub row. Left-joined to int_seller_acquisition on seller_id: origin stays NULL for sellers with no funnel match (~88% of the transacting population, per PROCESS.md's corrected coverage finding). Left-joined to stg_sellers for seller_city/seller_state."
    columns:
      - name: seller_id
        description: "Unique identifier for a seller (marketplace account). Grain of this model."
        tests:
          - unique
          - not_null
      - name: gmv
        description: "SUM(price) across delivered orders only. From int_seller_order_activity."
        tests:
          - not_null
      - name: order_count
        description: "COUNT(DISTINCT order_id) across delivered orders only. From int_seller_order_activity."
        tests:
          - not_null
      - name: cancellation_rate
        description: "Distinct cancelled_unavailable order count / distinct total order count for the seller. From int_seller_order_activity."
      - name: unresolved_rate
        description: "Distinct unresolved_unknown order count / distinct total order count for the seller. From int_seller_order_activity."
      - name: recency_days
        description: "Reference date minus the seller's last delivered order's order_purchase_timestamp, in days. NULL if the seller has no delivered orders. From int_seller_order_activity."
      - name: trend_eligible
        description: "True if the seller's delivered order_count >= 4. From int_seller_order_activity."
      - name: orders_last_30d
        description: "Delivered order count in the 30 days immediately before (and including) the reference date. NULL if trend_eligible is false. From int_seller_order_activity."
      - name: orders_prior_30d
        description: "Delivered order count in the 30 days before orders_last_30d's window. NULL if trend_eligible is false. From int_seller_order_activity."
      - name: top_category
        description: "The seller's highest-GMV product category, from int_seller_category_mix. Ties broken alphabetically by category_name — deterministic only, not business-meaningful. NULL if the seller has no known-category sales (absent from int_seller_category_mix)."
      - name: category_concentration_pct
        description: "top_category's share of the seller's total known-category GMV (carried through from int_seller_category_mix.category_gmv_pct on the top-category row, not recomputed). NULL if the seller has no known-category sales."
      - name: origin
        description: "Acquisition channel (e.g. social, paid_search, organic_search, email) from int_seller_acquisition. NULL for sellers with no funnel-attribution match (~88% of the transacting population) — secondary/caveated driver, see PROCESS.md."
      - name: seller_city
        description: "City where the seller is registered. From stg_sellers."
      - name: seller_state
        description: "State where the seller is registered. From stg_sellers."

  - name: mart_seller_risk_scores
    description: "One row per seller, n=2,970 — NOT the full 3,095-seller population in mart_seller_health. The 125 'never-activated' sellers (recency_days IS NULL in mart_seller_health — no delivered orders ever) are excluded here entirely, not zero-filled: they have no is_churned label and therefore no meaningful risk_score. This exclusion is a candidate decision from the churn_model/train_churn_model.py build (2026-08-25) that is NOT YET documented in PROCESS.md as of this model's creation — check PROCESS.md for a 'never-activated sellers' section; if present, it supersedes this note. Thin wrapper over the seed_seller_risk_scores seed, which is written by churn_model/gmv_at_risk.py: risk_score is predict_proba from a LogisticRegression pipeline refit on the FULL modeled population (in-sample scores, generated for consistent per-seller scoring — NOT the held-out test-set evaluation; see churn_model/results/baseline_run_2026-08-25.txt for the model's official accuracy/precision/recall/F1/ROC-AUC). gmv_at_risk_weighted = risk_score * gmv, labeled 'GMV exposure' per CLAUDE.md's framing discipline, never 'revenue loss' or 'profit impact' — no margin/profit data exists. This is a STATIC SNAPSHOT — the seed does not auto-refresh; rerun churn_model/gmv_at_risk.py, then `dbt seed --select seed_seller_risk_scores`, then `dbt run --select mart_seller_risk_scores` after any model retrain. Full methodology: churn_model/gmv_at_risk.py and churn_model/train_churn_model.py."
    columns:
      - name: seller_id
        description: "Unique identifier for a seller. Grain of this model. Not present for the 125 never-activated sellers excluded from the modeled population — see model description."
        tests:
          - unique
          - not_null
      - name: risk_score
        description: "predict_proba(is_churned=1) from the full-population-refit LogisticRegression pipeline (churn_model/gmv_at_risk.py). In-sample, continuous in [0,1] — a correlational risk indicator, not a causal claim."
        tests:
          - not_null
      - name: gmv
        description: "SUM(price) across delivered orders only, carried through from mart_seller_health."
        tests:
          - not_null
      - name: gmv_at_risk_weighted
        description: "risk_score * gmv — 'GMV exposure,' per CLAUDE.md's labeling discipline (never 'revenue loss'/'profit impact', since no margin data exists)."
        tests:
          - not_null
